name: Deploy WebGPU demos to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable and wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Ubuntu's packaged Binaryen is too old for the wasm features current Rust emits.
      - name: Install Binaryen
        env:
          BINARYEN: version_133
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BINARYEN" -R WebAssembly/binaryen \
            -p "binaryen-$BINARYEN-x86_64-linux.tar.gz*" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum -c "binaryen-$BINARYEN-x86_64-linux.tar.gz.sha256"
          tar xzf "binaryen-$BINARYEN-x86_64-linux.tar.gz"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: pages-wasm
          cache-all-crates: true

      - name: Read exact wasm-bindgen version from Cargo.lock
        id: bindgen
        run: printf 'version=%s\n' "$(bash web/build.sh --bindgen-version)" >> "$GITHUB_OUTPUT"

      - name: Install matching wasm-bindgen CLI
        env:
          BINDGEN_VERSION: ${{ steps.bindgen.outputs.version }}
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1 || \
             [[ "$(wasm-bindgen --version)" != "wasm-bindgen $BINDGEN_VERSION" ]]; then
            cargo install wasm-bindgen-cli --version "$BINDGEN_VERSION" --locked --force
          fi
          test "$(wasm-bindgen --version)" = "wasm-bindgen $BINDGEN_VERSION"

      - name: Build four demos and static site
        run: bash web/build.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
