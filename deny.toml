[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # ttf-parser is unmaintained; it comes from Bevy's text stack (dev examples only), and
  # Bevy 0.20 ignores the same advisory.
  "RUSTSEC-2026-0192",
  # ruzstd decompression bomb: bevy_image 0.20 pins ruzstd 0.8 (for the SMAA lookup tables in
  # bevy_anti_alias) and the fix is in 0.9.1. Only decoding untrusted zstd KTX2 images is
  # affected; dynlight decodes none. Remove once Bevy updates.
  "RUSTSEC-2026-0344",
  # paste is unmaintained (informational, no vulnerability). It is a proc macro of pulp, which
  # exr uses; exr comes with Bevy's `exr` feature, a native dev-dependency for loading HDR skies
  # in the examples. Remove once exr or pulp drops paste.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licences only (AGENTS.md).
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "glam", deny-multiple-versions = true },
  { name = "naga", deny-multiple-versions = true },
  { name = "wesl", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
